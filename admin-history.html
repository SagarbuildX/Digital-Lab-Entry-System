<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entry History | Digital Lab Entry</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

    <nav class="admin-nav">

        <div class="admin-logo">
            <span>🧪</span>
            Digital Lab Entry
        </div>

        <a
            href="admin.html"
            class="admin-home">

            ← Admin Dashboard

        </a>

    </nav>


    <main class="admin-main">

        <!-- Heading -->

        <div class="admin-heading">

            <span class="admin-badge">
                ADMIN PORTAL
            </span>

            <h1>
                Entry History
            </h1>

            <p id="historyTitle">
                Laboratory entry records
            </p>

        </div>


        <!-- History Summary -->

        <section class="admin-card history-summary">

            <div class="admin-card-header">

                <div>

                    <h2 id="historyHeading">
                        Loading...
                    </h2>

                    <p id="historyCount">
                        Loading entry records...
                    </p>

                </div>

                <div class="admin-card-icon">
                    📊
                </div>

            </div>

        </section>


        <!-- Entries -->

        <div id="historyEntries"></div>


        <!-- Back -->

        <a
            href="admin.html"
            class="admin-back">

            ← Back to Admin Dashboard

        </a>

    </main>


    <footer class="admin-footer">

        <p>
            🧪 Digital Lab Entry
        </p>

        <p>
            Smart Laboratory Entry Management System
        </p>

    </footer>


    <script
        type="module"
        src="admin-history.js">
    </script>

</body>

</html>
