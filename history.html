<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Entry History | Digital Lab Entry</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="history-page">


    <!-- ================= NAVBAR ================= -->

    <nav class="history-nav">

        <div class="history-logo">
            <span>🧪</span>
            Digital Lab Entry
        </div>

        <a
            href="dashboard.html"
            class="history-back">
            ← Dashboard
        </a>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="history-main">


        <div class="history-heading">

            <span class="history-badge">
                STUDENT PORTAL
            </span>

            <h1>
                My Entry History
            </h1>

            <p>
                View your previous laboratory entry records.
            </p>

        </div>


        <!-- ================= HISTORY CARD ================= -->

        <section class="history-card">


            <div class="history-card-header">

                <div>

                    <h2>
                        Laboratory Visits
                    </h2>

                    <p>
                        Your recorded lab entries
                    </p>

                </div>

                <div class="history-icon">
                    📊
                </div>

            </div>


            <p id="historyMessage">
                Loading your entry history...
            </p>


            <div id="historyList"></div>


        </section>


        <!-- ================= BACK BUTTON ================= -->

        <a
            href="dashboard.html"
            class="history-dashboard-button">

            ← Back to Dashboard

        </a>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="history-footer">

        <p>
            🧪 Digital Lab Entry
        </p>

        <p>
            Smart Laboratory Entry Management System
        </p>

    </footer>


    <script
        type="module"
        src="history.js">
    </script>


</body>

</html>
