<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile | Digital Lab Entry</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="student-dashboard">


    <!-- ================= NAVBAR ================= -->

    <nav class="dashboard-nav">

        <div class="dashboard-logo">

            <span>🧪</span>

            Digital Lab Entry

        </div>


        <button
            id="logoutButton"
            class="nav-logout">

            Logout

        </button>

    </nav>



    <!-- ================= PROFILE ================= -->

    <main class="profile-main">


        <div class="profile-heading">

            <span class="dashboard-badge">

                STUDENT PROFILE

            </span>


            <h1>
                My Profile 👤
            </h1>


            <p>
                View your registered student account details.
            </p>

        </div>



        <!-- PROFILE CARD -->

        <section class="profile-card">


            <!-- PROFILE HEADER -->

            <div class="profile-card-header">


                <div class="profile-avatar">

                    👨‍🎓

                </div>


                <div>

                    <h2 id="profileName">
                        Student
                    </h2>

                    <p id="profileEmail">
                        Loading email...
                    </p>

                </div>


            </div>



            <!-- PROFILE DETAILS -->

            <div class="profile-details">


                <div class="profile-detail">

                    <span>
                        🆔 Student ID
                    </span>

                    <strong id="profileStudentId">
                        —
                    </strong>

                </div>



                <div class="profile-detail">

                    <span>
                        🎓 Course
                    </span>

                    <strong id="profileCourse">
                        —
                    </strong>

                </div>



                <div class="profile-detail">

                    <span>
                        📚 Year
                    </span>

                    <strong id="profileYear">
                        —
                    </strong>

                </div>



                <div class="profile-detail">

                    <span>
                        📧 Email
                    </span>

                    <strong id="profileEmailDetail">
                        —
                    </strong>

                </div>


            </div>



            <!-- ACCOUNT STATUS -->

            <div class="profile-status">

                <span class="status-dot"></span>

                Account Active

            </div>


            <p id="profileMessage"></p>


        </section>



        <!-- BACK BUTTON -->

        <a
            href="dashboard.html"
            class="dashboard-home">

            ← Back to Dashboard

        </a>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="dashboard-footer">

        <p>
            🧪 Digital Lab Entry
        </p>

        <p>
            Smart Laboratory Entry Management System
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="profile.js">
    </script>


</body>

</html>
