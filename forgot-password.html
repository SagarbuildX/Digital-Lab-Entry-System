<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Reset Password | Digital Lab Entry
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="auth-page">


    <div class="auth-wrapper">


        <!-- Left Branding -->

        <div class="auth-brand">

            <div class="brand-icon">
                🔐
            </div>


            <h1>
                Digital Lab<br>
                <span>Entry</span>
            </h1>


            <p>
                Smart Laboratory Entry Management System
            </p>


            <div class="brand-feature">
                ✓ Secure Password Recovery
            </div>


            <div class="brand-feature">
                ✓ Email Verification
            </div>


            <div class="brand-feature">
                ✓ Easy Account Access
            </div>

        </div>


        <!-- Reset Password Section -->

        <div class="auth-form-section">


            <div class="auth-heading">

                <span class="auth-badge">
                    PASSWORD RECOVERY
                </span>


                <h2>
                    Forgot Password?
                </h2>


                <p>
                    Enter your registered email to receive a password reset link.
                </p>

            </div>


            <div class="auth-form-card">


                <form id="forgotPasswordForm">


                    <div class="form-group">

                        <label for="email">
                            Registered Email
                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your registered email"
                            required>

                    </div>


                    <p id="resetMessage"></p>


                    <button
                        type="submit"
                        class="auth-submit">

                        Send Reset Email →

                    </button>


                </form>


                <div class="auth-bottom">

                    <span>
                        Remember your password?
                    </span>


                    <a href="login.html">
                        Back to Login
                    </a>

                </div>


                <a
                    href="index.html"
                    class="back-home">

                    ← Back to Home

                </a>


            </div>

        </div>

    </div>


    <script
        type="module"
        src="forgot-password.js">
    </script>

</body>

</html>
